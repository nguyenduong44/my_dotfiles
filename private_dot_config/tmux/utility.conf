# Run Claude Code in a separate session
bind -r y run-shell '
SESSION="agy-$(echo #{pane_current_path} | md5sum | cut -c1-8)";

if ! tmux has-session -t "$SESSION" 2>/dev/null; then
  tmux new-session -d \
    -s "$SESSION" \
    -c "#{pane_current_path}" \
    "/home/nguyenduong/.local/bin/agy"
fi

tmux display-popup \
  -w 90% \
  -h 90% \
  -E "tmux attach-session -t $SESSION"
'
