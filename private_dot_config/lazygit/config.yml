customCommands:
  - key: "C"
    command: "git cz"
    description: "commit with commitizen"
    context: "files"
    loadingText: "opening commitizen commit tool"
    output: terminal
os:
  edit: 'if [ -z "$NVIM" ]; then nvim -- {{filename}}; else nvim --server "$NVIM" --remote-send "q"; nvim --server "$NVIM" --remote-send "<Cmd>lua require(\"craftzdog.utils.lazygit\").focus_origin()<CR>"; nvim --server "$NVIM" --remote {{filename}}; fi'
  editAtLine: 'if [ -z "$NVIM" ]; then nvim +{{line}} -- {{filename}}; else nvim --server "$NVIM" --remote-send "q"; nvim --server "$NVIM" --remote-send "<Cmd>lua require(\"craftzdog.utils.lazygit\").focus_origin()<CR>"; nvim --server "$NVIM" --remote {{filename}}; nvim --server "$NVIM" --remote-send ":{{line}}<CR>"; fi'
gui:
  nerdFontsVersion: "3"
  mouseEvents: false
  scrollHeight: 30
git:
  autoFetch: false
  diffRenderers:
    - command: delta --dark --paging=never --syntax-theme="Solarized (dark)"
